# Relays third-party bot inline PR review comments as a real-user reply so
# Cursor Automations can see them.
#
# Cursor intentionally filters GitHub App / bot comments from automation
# triggers (security / loop prevention). UI "Anyone" does not override that.
# See: https://forum.cursor.com/t/automations-reacting-to-bot-pr-comments/159297
#
# Setup (one-time):
# 1. Create a classic or fine-grained PAT for a real user with permission to
#    write pull request review comments on this repository.
# 2. Add it as repo (or org) Actions secret: CURSOR_AUTOFIX_RELAY_PAT
# 3. Merge this workflow to the default branch.
#
# Without the secret, the job exits successfully with a warning and does nothing.

name: relay bot review comments

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  relay:
    name: Relay to Cursor automation
    runs-on: ubuntu-latest
    # Only top-level review comments from known review bots (not replies).
    if: >
      github.event.comment.user.type == 'Bot' &&
      github.event.comment.in_reply_to_id == null &&
      contains(fromJSON('["chatgpt-codex-connector[bot]"]'), github.event.comment.user.login)
    steps:
      - name: Post human-authored relay reply
        env:
          RELAY_PAT: ${{ secrets.CURSOR_AUTOFIX_RELAY_PAT }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_PATH: ${{ github.event.comment.path }}
          COMMENT_LINE: ${{ github.event.comment.line }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${RELAY_PAT:-}" ]; then
            echo "::warning::CURSOR_AUTOFIX_RELAY_PAT is not configured. Bot inline review comments will not trigger Cursor Automations until this secret is set."
            exit 0
          fi

          # Avoid re-relaying if a previous run already posted on this thread.
          existing="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.in_reply_to_id == ${COMMENT_ID}) | select(.body | contains(\"[cursor-autofix-relay]\"))] | length")"
          if [ "${existing}" != "0" ]; then
            echo "Relay reply already present for comment ${COMMENT_ID}; skipping."
            exit 0
          fi

          # Keep parent feedback visible so the automation can act from the
          # triggering reply. Truncate very long bot bodies.
          summary="$(COMMENT_BODY="${COMMENT_BODY}" python3 -c '
          import os
          body = os.environ.get("COMMENT_BODY", "")
          lines = [ln for ln in body.splitlines() if ln.strip()]
          text = "\n".join(lines)
          if len(text) > 1800:
              text = text[:1800].rstrip() + "\n…"
          print(text)
          ')"

          body="$(printf '%s\n' \
            '[cursor-autofix-relay] Please address the parent inline review comment.' \
            '' \
            "- File: \`${COMMENT_PATH}\`" \
            "- Line: ${COMMENT_LINE:-n/a}" \
            "- Parent: ${COMMENT_URL}" \
            '' \
            'Parent feedback:' \
            "${summary}")"

          # Post as the PAT user (must not use GITHUB_TOKEN / a bot identity).
          GH_TOKEN="${RELAY_PAT}" gh api \
            --method POST \
            "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            -f body="${body}" \
            -F in_reply_to="${COMMENT_ID}" \
            --jq '{id, html_url, user: .user.login}'
